name: Phase 3 verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-tts
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Apply self-audit fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/tts.rs')
          text = path.read_text()
          text = text.replace(
              '        validate_wav(&temp)\n    })();',
              '        validate_wav(&temp).map_err(|error| TtsError::InvalidReturnedAudio(error.to_string()))\n    })();'
          )
          text = text.replace(
              '''    match flavor {\n        QueryFlavor::Voicevox => {}\n        QueryFlavor::Aivis => {\n            // AivisSpeech reuses the `kana` field as normal source text. Preserve the engine's\n            // value if present and populate it only when omitted/null so synthesis stays natural.\n            if object.get("kana").is_none_or(serde_json::Value::is_null) {\n                object.insert("kana".into(), serde_json::Value::from(request.text));\n            }\n        }\n    }''',
              '''    match flavor {\n        QueryFlavor::Voicevox => {}\n        QueryFlavor::Aivis => {\n            // Keep AivisSpeech query handling isolated from VOICEVOX even where the current\n            // fields are shared. Provider-specific fields can be added here without coupling.\n        }\n    }'''
          )
          path.write_text(text)

          path = Path('tests/integration_phase3.rs')
          text = path.read_text()
          marker = '\nstruct MockEngine {'
          audit_test = r'''

#[test]
fn doctor_remains_non_fatal_when_local_tts_engines_are_unavailable() {
    let directory = tempfile::tempdir().unwrap();
    let output = ved(directory.path(), &["doctor"]);
    let stdout = String::from_utf8_lossy(&output.stdout);
    assert!(stdout.contains("VOICEVOX"));
    assert!(stdout.contains("AivisSpeech"));
}
'''
          if 'doctor_remains_non_fatal_when_local_tts_engines_are_unavailable' not in text:
              text = text.replace(marker, audit_test + marker)
          path.write_text(text)
          PY
          cargo fmt
      - name: Commit self-audit fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "Address Phase 3 self-audit findings"
            git push origin HEAD:feature/phase3-tts
          fi
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Diff check
        run: git diff --check
      - name: Working tree
        run: git status --short
