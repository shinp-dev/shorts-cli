name: Phase 3 verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-tts
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Normalize generated files and formatting
        run: |
          cargo generate-lockfile
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/project/io.rs')
          text = path.read_text()
          text = text.replace(
              '''    match json.get("version").and_then(serde_json::Value::as_u64) {\n        Some(1 | 2) => {\n            json["version"] = serde_json::Value::from(crate::project::PROJECT_VERSION);\n            if json.get("voice_clips").is_none() {\n                json["voice_clips"] = serde_json::Value::Array(Vec::new());\n            }\n        }\n        _ => {}\n    }''',
              '''    if let Some(1 | 2) = json.get("version").and_then(serde_json::Value::as_u64) {\n        json["version"] = serde_json::Value::from(crate::project::PROJECT_VERSION);\n        if json.get("voice_clips").is_none() {\n            json["voice_clips"] = serde_json::Value::Array(Vec::new());\n        }\n    }'''
          )
          path.write_text(text)

          path = Path('src/tts.rs')
          text = path.read_text()
          text = text.replace('    #[error("unsupported provider: {0}")]\n    UnsupportedProvider(String),\n', '')
          text = text.replace('    pub path: PathBuf,\n', '')
          text = text.replace('                    path: target,\n', '')
          text = text.replace('                path: target,\n', '')
          text = text.replace('        path: target,\n', '')
          text = text.replace('                path: expected,\n', '')
          text = text.replace("pub fn default_endpoint(kind: TtsProviderKind) -> &'static str {\n    provider(kind).default_endpoint()\n}\n\n", '')
          text = text.replace('        assert!(first.path.is_file());', '        assert!(Path::new(&first.stored_path).ends_with(format!("{}.wav", first.cache_key)));')
          path.write_text(text)

          path = Path('tests/integration_phase3.rs')
          text = path.read_text().replace(
              '!entry.path().extension().is_some_and(|value| value == "wav")',
              'entry.path().extension().is_none_or(|value| value != "wav")'
          )
          path.write_text(text)
          PY
          cargo fmt
      - name: Commit normalization when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock src tests
            git commit -m "Fix initial Phase 3 clippy findings"
            git push origin HEAD:feature/phase3-tts
          fi
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Diff check
        run: git diff --check
      - name: Working tree
        run: git status --short
