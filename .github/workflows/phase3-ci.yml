name: Phase 3 verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-tts
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Normalize generated files and formatting
        run: |
          cargo generate-lockfile
          sed -i 's/assert_eq!(project\["version"\], 2);/assert_eq!(project["version"], 3);/' tests/integration_phase2.rs
          cargo fmt
      - name: Commit normalization when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock src tests
            git commit -m "Apply rustfmt and update Phase 3 lockfile"
            git push origin HEAD:feature/phase3-tts
          fi
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Diff check
        run: git diff --check
      - name: Working tree
        run: git status --short
