name: Phase 3 verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-tts
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --bin ved
      - name: Integration tests
        run: |
          cargo test --test integration_phase2
          cargo test --test integration_phase3
      - name: TTS mock tests
        run: |
          cargo test --test integration_phase3 phase_three_tts_uses_audio_clip_cache_history_and_render_plan -- --exact
          cargo test --test integration_phase3 tts_connection_and_invalid_audio_fail_cleanly -- --exact
          cargo test --bin ved tts::tests::mock_provider_lists_and_synthesizes_special_text -- --exact
      - name: Cache matrix
        run: cargo test --bin ved tts::tests::cache_key_matrix_excludes_timeline_and_volume -- --exact
      - name: Phase 1 and Phase 2 regression
        run: |
          cargo test --test integration_phase2 phase_one_edit_and_render_flow_regresses_cleanly -- --exact
          cargo test --test integration_phase2 phase_two_pipeline_uses_one_final_timeline -- --exact
      - name: Doctor regression
        run: cargo test --test integration_phase3 doctor_remains_non_fatal_when_local_tts_engines_are_unavailable -- --exact
      - name: Diff check
        run: git diff --check
      - name: Working tree
        run: git status --short
